<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0f" />
  <title>Apsara Vimana — Asistente</title>
  <style>
    :root {
      --bg: #0a0a0f;
      --oro: #ffbd00;
      --card: #14141c;
      --texto: #f2f2f2;
      --muted: #9a9aa8;
      --borde: #2a2a38;
      --app-h: 100dvh;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
    html, body {
      height: var(--app-h);
      width: 100%;
      background: var(--bg);
      color: var(--texto);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      overflow: hidden;
    }
    .app {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-width: 720px;
      margin: 0 auto;
    }
    .topbar {
      flex-shrink: 0;
      padding: 12px 16px;
      border-bottom: 1px solid var(--borde);
      background: rgba(10,10,15,0.95);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .topbar img.logo {
      width: 40px; height: 40px; border-radius: 50%; object-fit: cover;
      border: 1px solid var(--oro);
    }
    .brand-title { font-weight: 800; font-size: 15px; letter-spacing: 0.04em; color: var(--oro); }
    .brand-sub { font-size: 11px; color: var(--muted); }
    #conversation {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 16px 12px 8px;
      -webkit-overflow-scrolling: touch;
    }
    .welcome {
      text-align: center;
      padding: 32px 16px;
      color: var(--muted);
    }
    .welcome h1 { color: var(--oro); font-size: 22px; margin: 8px 0; }
    .welcome p { font-size: 14px; line-height: 1.5; }
    .msg { display: flex; gap: 10px; margin-bottom: 14px; align-items: flex-start; }
    .msg.user { justify-content: flex-end; }
    .msg.user .bubble {
      background: #2a1f00;
      border: 1px solid var(--oro);
      color: #fff8e0;
      border-radius: 16px 16px 4px 16px;
      max-width: 85%;
      padding: 12px 14px;
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.bot { justify-content: flex-start; }
    .msg.bot .avatar {
      width: 44px; height: 44px; border-radius: 50%; object-fit: cover;
      flex-shrink: 0; border: 1px solid var(--borde);
    }
    .bot-column { max-width: 85%; display: flex; flex-direction: column; gap: 8px; }
    .bot-bubble {
      background: var(--card);
      border: 1px solid var(--borde);
      border-radius: 16px 16px 16px 4px;
      padding: 12px 14px;
      font-size: 14px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .links { display: flex; flex-direction: column; gap: 6px; }
    .link-card {
      display: block;
      text-decoration: none;
      background: #101018;
      border: 1px solid var(--borde);
      border-radius: 12px;
      padding: 10px 12px;
    }
    .link-title { display: block; color: var(--oro); font-size: 13px; font-weight: 600; }
    .link-url { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; }
    .options { display: flex; flex-wrap: wrap; gap: 6px; }
    .opt-btn {
      background: transparent;
      border: 1px solid var(--oro);
      color: var(--oro);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 12px;
      cursor: pointer;
    }
    #typing {
      padding: 0 16px 6px;
      font-size: 12px;
      color: var(--muted);
      flex-shrink: 0;
    }
    .composer-area {
      flex-shrink: 0;
      border-top: 1px solid var(--borde);
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
      background: #0d0d14;
    }
    #composer {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }
    #message {
      flex: 1;
      resize: none;
      min-height: 42px;
      max-height: 140px;
      border-radius: 14px;
      border: 1px solid var(--borde);
      background: var(--card);
      color: var(--texto);
      padding: 10px 12px;
      font-size: 15px;
      line-height: 1.4;
      outline: none;
    }
    #message:focus { border-color: var(--oro); }
    #send {
      width: 46px; height: 46px;
      border-radius: 50%;
      border: none;
      background: var(--oro);
      color: #111;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      flex-shrink: 0;
    }
    #send:disabled { opacity: 0.5; cursor: wait; }
  </style>
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <img class="logo" src="imagenes/estados/2.jpg" alt="Apsara" width="40" height="40"
           onerror="this.style.display='none'" />
      <div>
        <div class="brand-title">APSARA VIMANA</div>
        <div class="brand-sub"><span style="color:#39ff14">●</span> presente · asistente</div>
      </div>
    </header>

    <section class="conversation" id="conversation">
      <div class="welcome" id="welcome">
        <div style="font-size:13px;color:var(--oro)">Namaste</div>
        <h1>Apsara Vimana</h1>
        <p>Puedo ayudarte con sabiduría de Vimana, maestros, música, glosario y consultas generales.</p>
      </div>
    </section>

    <div id="typing" hidden>Apsara está pensando…</div>

    <div class="composer-area">
      <form class="composer" id="composer" autocomplete="off">
        <textarea id="message" name="message" rows="1" maxlength="600"
          placeholder="Escribe tu mensaje…" enterkeyhint="send"></textarea>
        <button type="submit" class="send" id="send" title="Enviar">➜</button>
      </form>
    </div>
  </div>

  <script src="js/apsara.js" defer></script>
</body>
</html>
